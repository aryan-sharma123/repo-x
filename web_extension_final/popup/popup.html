<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Floating Input Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Floating Input Settings</h1>

    <div class="settings-group">
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="habit">Habit Mode (Quick Box)</option>
        <option value="advanced">Advanced Mode (LLM Enhanced)</option>
        <option value="off">Disable Extension</option>
      </select>
    </div>

    <div class="settings-group">
      <label for="position">Overlay Position:</label>
      <select id="position">
        <option value="top">Top of Screen</option>
        <option value="center">Center</option>
        <option value="bottom">Bottom</option>
      </select>
    </div>

    <div class="settings-group">
      <label for="width">Overlay Width:</label>
      <input type="text" id="width" placeholder="600px" />
    </div>

    <div class="settings-group">
      <label for="height">Overlay Height:</label>
      <input type="text" id="height" placeholder="60px" />
    </div>

    <div class="settings-group checkbox-group">
      <input type="checkbox" id="animation" checked />
      <label for="animation">Smooth Appearance</label>
    </div>

    <button id="save">Save</button>

    <div class="footer">
      <p>Tip: Hit ESC to close the input box</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
